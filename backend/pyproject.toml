[project]
name = "agentic-filmops-backend"
version = "0.1.0"
description = "Agentic FilmOps backend: FastAPI app, MCP servers, and agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ001: SPEC §4 timestamps (e.g. "2026-09-02T14:00") are naive by design —
# the production is scheduled in a single local timezone, not UTC.
ignore = ["DTZ001"]
