[project]
name = "agentic-filmops-backend"
version = "0.1.0"
description = "Agentic FilmOps backend: FastAPI app, MCP servers, and agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "mcp>=1.0,<2.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ001/DTZ005: SPEC §4/§8 timestamps (e.g. "2026-09-02T14:00", "14:07:13")
# are naive by design — the production is scheduled in a single local
# timezone, not UTC.
# B008: FastAPI's Depends() is idiomatic in argument defaults; this rule is
# written for other frameworks where that's a real footgun.
ignore = ["DTZ001", "DTZ005", "B008"]
